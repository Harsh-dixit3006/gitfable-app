name: Deploy Dev

on:
  push:
    branches: [devel]

env:
  BACKEND_IMAGE: ghcr.io/nishantg96/gitfable-backend
  FRONTEND_IMAGE: ghcr.io/nishantg96/gitfable-frontend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Run backend tests
        working-directory: backend
        run: go test ./... -v

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false

      - name: Run frontend lint (via build)
        working-directory: frontend
        run: CI=true npm run build

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: |
          TAG="dev-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}
            ${{ env.BACKEND_IMAGE }}:latest-dev

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            REACT_APP_BACKEND_URL=${{ secrets.DEV_REACT_APP_BACKEND_URL }}
            REACT_APP_SUPABASE_URL=${{ secrets.DEV_REACT_APP_SUPABASE_URL }}
            REACT_APP_SUPABASE_ANON_KEY=${{ secrets.DEV_REACT_APP_SUPABASE_ANON_KEY }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}
            ${{ env.FRONTEND_IMAGE }}:latest-dev

  deploy:
    name: Deploy to Dev VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Preflight Tailscale SSH auth (Dev)
        run: |
          tailscale ssh deploy@${{ secrets.DEV_TAILSCALE_HOST }} "set -e; test -d /home/deploy; test -f /home/deploy/gitfable/docker/.env.vps-dev; test -f /home/deploy/gitfable/docker/secrets/postgres_user.txt; test -f /home/deploy/gitfable/docker/secrets/postgres_password.txt; test -f /home/deploy/gitfable/docker/secrets/redis_password.txt; echo Tailscale SSH preflight passed"

      - name: Sync infrastructure files to VPS over Tailscale
        run: |
          tar czf /tmp/dev-infra.tar.gz docker/docker-compose.vps-dev.yml docker/caddy/Caddyfile.dev backend/sql/migrations scripts/deploy.sh scripts/backup-db.sh
          tailscale ssh deploy@${{ secrets.DEV_TAILSCALE_HOST }} "mkdir -p /home/deploy/gitfable"
          cat /tmp/dev-infra.tar.gz | tailscale ssh deploy@${{ secrets.DEV_TAILSCALE_HOST }} "tar xzf - -C /home/deploy/gitfable"

      - name: Deploy via Tailscale SSH
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          tailscale ssh deploy@${{ secrets.DEV_TAILSCALE_HOST }} "export GHCR_TOKEN='${GHCR_TOKEN}'; export GHCR_USERNAME='${GHCR_USERNAME}'; cd ~/gitfable; ./scripts/deploy.sh dev '${IMAGE_TAG}'"

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for deployment to settle
        run: sleep 10

      - name: Check health endpoint
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.DEV_BACKEND_HEALTH_URL }}")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Health check failed with status: $HTTP_STATUS"
            exit 1
          fi
          echo "Health check passed"

      - name: Check ready endpoint
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.DEV_BACKEND_READY_URL }}")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Ready check failed with status: $HTTP_STATUS"
            exit 1
          fi
          echo "Ready check passed"
