name: Rollback Prod

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to roll back to (e.g., prod-abc1234)"
        required: true
        type: string
      reason:
        description: "Reason for rollback"
        required: true
        type: string

jobs:
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Confirm rollback
        run: |
          echo "Rolling back to: ${{ inputs.image_tag }}"
          echo "Reason: ${{ inputs.reason }}"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Rollback via Tailscale SSH
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          tailscale ssh deploy@${{ secrets.PROD_TAILSCALE_HOST }} "export GHCR_TOKEN='${GHCR_TOKEN}'; export GHCR_USERNAME='${GHCR_USERNAME}'; cd ~/gitfable; ./scripts/deploy.sh prod '${IMAGE_TAG}'"

  smoke-test:
    name: Smoke Test After Rollback
    runs-on: ubuntu-latest
    needs: rollback
    steps:
      - name: Wait for rollback to settle
        run: sleep 10

      - name: Check health endpoint
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.PROD_BACKEND_HEALTH_URL }}")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Health check FAILED after rollback!"
            exit 1
          fi
          echo "Health check passed after rollback"
