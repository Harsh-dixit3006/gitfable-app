[project]
name = "gitfable-backend"
version = "0.1.0"
description = "GitFable backend API - gamified open-source contribution matching"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.25.0",
    "pydantic>=2.12.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.2.0",
    "starlette>=0.37.0",
    "python-multipart>=0.0.22",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "firebase-admin>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "requests>=2.32.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
