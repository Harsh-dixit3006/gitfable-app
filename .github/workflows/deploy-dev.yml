name: Deploy Dev

on:
  push:
    branches: [devel]

env:
  BACKEND_IMAGE: ghcr.io/nishantg96/gitfable-backend
  FRONTEND_IMAGE: ghcr.io/nishantg96/gitfable-frontend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Run backend tests
        working-directory: backend
        run: go test ./... -v

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false

      - name: Run frontend lint (via build)
        working-directory: frontend
        run: CI=true npm run build

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: |
          TAG="dev-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}
            ${{ env.BACKEND_IMAGE }}:latest-dev

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            REACT_APP_BACKEND_URL=${{ secrets.DEV_REACT_APP_BACKEND_URL }}
            REACT_APP_SUPABASE_URL=${{ secrets.DEV_REACT_APP_SUPABASE_URL }}
            REACT_APP_SUPABASE_ANON_KEY=${{ secrets.DEV_REACT_APP_SUPABASE_ANON_KEY }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}
            ${{ env.FRONTEND_IMAGE }}:latest-dev

  deploy:
    name: Deploy to Dev VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Preflight SSH auth (Dev)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            test -d /home/deploy
            echo "SSH preflight passed"

      - name: Sync infrastructure files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker/docker-compose.vps-dev.yml,docker/caddy/Caddyfile.dev,backend/sql/migrations/,scripts/deploy.sh,scripts/backup-db.sh"
          target: /home/deploy/gitfable/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GHCR_USERNAME,IMAGE_TAG
          script: |
            export GHCR_TOKEN="${GHCR_TOKEN}"
            export GHCR_USERNAME="${GHCR_USERNAME}"
            cd ~/gitfable
            ./scripts/deploy.sh dev "$IMAGE_TAG"
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for deployment to settle
        run: sleep 10

      - name: Check health endpoint
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.DEV_BACKEND_HEALTH_URL }}")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Health check failed with status: $HTTP_STATUS"
            exit 1
          fi
          echo "Health check passed"

      - name: Check ready endpoint
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.DEV_BACKEND_READY_URL }}")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Ready check failed with status: $HTTP_STATUS"
            exit 1
          fi
          echo "Ready check passed"
