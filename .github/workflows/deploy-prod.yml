name: Deploy Prod

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend tests
        run: |
          cd backend
          go test ./... -v

      - name: Frontend install and test
        run: |
          cd frontend
          npm ci
          npm test -- --watchAll=false

      - name: Frontend build
        run: |
          cd frontend
          npm run build

  migration-dry-run-prod:
    runs-on: ubuntu-latest
    needs: test-and-build
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install migrate CLI
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.18.3/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/migrate

      - name: Validate migration state (Prod)
        run: |
          cd backend
          migrate -path sql/migrations -database "${{ secrets.PROD_DATABASE_URL }}" version || true

  deploy-prod:
    runs-on: ubuntu-latest
    needs:
      - test-and-build
      - migration-dry-run-prod
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy backend to Railway (Prod)
        run: |
          npm i -g @railway/cli
          railway up --service "${{ secrets.RAILWAY_PROD_SERVICE_NAME }}" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PROD_TOKEN }}

      - name: Install migrate CLI
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.18.3/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/migrate

      - name: Run DB migrations (Prod)
        run: |
          cd backend
          migrate -path sql/migrations -database "${{ secrets.PROD_DATABASE_URL }}" up

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          REACT_APP_BACKEND_URL: ${{ secrets.PROD_REACT_APP_BACKEND_URL }}
          REACT_APP_SUPABASE_URL: ${{ secrets.PROD_REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.PROD_REACT_APP_SUPABASE_ANON_KEY }}

      - name: Deploy frontend to Cloudflare Pages (Prod)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PROD_PROJECT_NAME }}
          directory: frontend/build
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke tests
        run: |
          curl -fsSL "${{ secrets.PROD_BACKEND_HEALTH_URL }}"
          curl -fsSL "${{ secrets.PROD_BACKEND_READY_URL }}"
