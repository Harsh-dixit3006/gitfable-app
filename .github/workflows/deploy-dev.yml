name: Deploy Dev

on:
  push:
    branches:
      - develop

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend tests
        run: |
          cd backend
          go test ./... -v

      - name: Frontend install and test
        run: |
          cd frontend
          npm ci
          npm test -- --watchAll=false

      - name: Frontend build
        run: |
          cd frontend
          npm run build

  migration-dry-run-dev:
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install migrate CLI
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.18.3/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/migrate

      - name: Validate migration state (Dev)
        run: |
          cd backend
          migrate -path sql/migrations -database "${{ secrets.DEV_DATABASE_URL }}" version || true

  deploy-backend-dev:
    runs-on: ubuntu-latest
    needs:
      - test-and-build
      - migration-dry-run-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Railway (Dev)
        run: |
          npm i -g @railway/cli
          railway up --service "${{ secrets.RAILWAY_DEV_SERVICE_NAME }}" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_DEV_TOKEN }}

  migrate-dev:
    runs-on: ubuntu-latest
    needs: deploy-backend-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install migrate CLI
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.18.3/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/migrate

      - name: Run DB migrations (Dev)
        run: |
          cd backend
          migrate -path sql/migrations -database "${{ secrets.DEV_DATABASE_URL }}" up

  deploy-frontend-dev:
    runs-on: ubuntu-latest
    needs:
      - test-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          REACT_APP_BACKEND_URL: ${{ secrets.DEV_REACT_APP_BACKEND_URL }}
          REACT_APP_SUPABASE_URL: ${{ secrets.DEV_REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.DEV_REACT_APP_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages (Dev)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_DEV_PROJECT_NAME }}
          directory: frontend/build
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  smoke-test-dev:
    runs-on: ubuntu-latest
    needs:
      - migrate-dev
      - deploy-frontend-dev
    steps:
      - name: API health
        run: |
          curl -fsSL "${{ secrets.DEV_BACKEND_HEALTH_URL }}"
          curl -fsSL "${{ secrets.DEV_BACKEND_READY_URL }}"
