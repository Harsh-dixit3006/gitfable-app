name: Rollback Prod

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to roll back to (e.g., prod-abc1234)"
        required: true
        type: string
      reason:
        description: "Reason for rollback"
        required: true
        type: string

jobs:
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Confirm rollback
        run: |
          echo "Rolling back to: ${{ inputs.image_tag }}"
          echo "Reason: ${{ inputs.reason }}"

      - name: Rollback via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,IMAGE_TAG
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        script: |
          export GHCR_TOKEN="${GHCR_TOKEN}"
          cd ~/gitfable
          ./scripts/deploy.sh prod "$IMAGE_TAG"

  smoke-test:
    name: Smoke Test After Rollback
    runs-on: ubuntu-latest
    needs: rollback
    steps:
      - name: Wait for rollback to settle
        run: sleep 10

      - name: Check health endpoint
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.PROD_BACKEND_HEALTH_URL }}")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Health check FAILED after rollback!"
            exit 1
          fi
          echo "Health check passed after rollback"
