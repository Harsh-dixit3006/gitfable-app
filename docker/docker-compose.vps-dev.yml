name: gitfable-dev

services:
  caddy:
    image: caddy:2-alpine
    container_name: gitfable-caddy-dev
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - gitfable-network

  frontend:
    image: ghcr.io/nishantg96/gitfable-frontend:${IMAGE_TAG:-latest-dev}
    container_name: gitfable-frontend-dev
    restart: always
    expose:
      - "80"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gitfable-network

  backend:
    image: ghcr.io/nishantg96/gitfable-backend:${IMAGE_TAG:-latest-dev}
    container_name: gitfable-backend-dev
    restart: always
    expose:
      - "8001"
    env_file:
      - .env.vps-dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.15"
          memory: 128M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gitfable-network

  postgres:
    image: postgres:16-alpine
    container_name: gitfable-postgres-dev
    restart: always
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: gitfable_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $(cat /run/secrets/postgres_user)"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - postgres_user
      - postgres_password
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - gitfable-network

  redis:
    image: redis:7-alpine
    container_name: gitfable-redis-dev
    restart: always
    command: >
      sh -c "redis-server --requirepass $$(cat /run/secrets/redis_password)"
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$(cat /run/secrets/redis_password) ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - redis_password
    networks:
      - gitfable-network

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

secrets:
  postgres_user:
    file: ./secrets/postgres_user.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt

networks:
  gitfable-network:
    driver: bridge
