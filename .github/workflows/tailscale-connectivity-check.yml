name: Tailscale Connectivity Check

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to check"
        required: true
        type: choice
        default: both
        options:
          - dev
          - prod
          - both

jobs:
  check:
    name: Check Tailscale SSH Reachability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Print Tailscale status
        run: tailscale status

      - name: Check Dev VPS over Tailscale SSH
        if: ${{ inputs.target == 'dev' || inputs.target == 'both' }}
        run: |
          tailscale ssh deploy@${{ secrets.DEV_TAILSCALE_HOST }} "set -e; hostname; test -d /home/deploy; echo dev-ok"

      - name: Check Prod VPS over Tailscale SSH
        if: ${{ inputs.target == 'prod' || inputs.target == 'both' }}
        run: |
          tailscale ssh deploy@${{ secrets.PROD_TAILSCALE_HOST }} "set -e; hostname; test -d /home/deploy; echo prod-ok"
